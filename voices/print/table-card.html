<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Table card · Voices of the Ladder</title>
<link rel="stylesheet" href="print.css">
<style>
  @page { size: 11in 8.5in; margin: 0; }
  .tent { padding: 0; }
  /* Two identical panels; the top one is upside down, so after folding each side reads right way up */
  .panel { position: absolute; left: 0; width: 11in; height: 4.25in; padding: 0.36in 0.5in 0.34in; display: grid; grid-template-rows: auto 1fr; gap: 0.2in; }
  .panel.upper { top: 0; transform: rotate(180deg); }
  .panel.lower { top: 4.25in; }
  .fold { position: absolute; top: 4.25in; width: 0.22in; border-top: 0.75pt solid #b3a78f; }
  .fold.l { left: 0.26in; }
  .fold.r { right: 0.26in; }
  .fold-word { position: absolute; top: calc(4.25in - 4pt); font: 600 5.5pt/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: #b3a78f; }
  .fold-word.l { left: 0.54in; }
  .fold-word.r { right: 0.54in; }

  .top { display: grid; grid-template-columns: auto 1fr auto; gap: 0.25in; align-items: end; padding-bottom: 0.14in; border-bottom: 1.2pt solid var(--ink); }
  .top .ladder-mark { width: 22pt; height: 38pt; color: var(--gold-2); }
  .top h1 { margin: 3pt 0 0; font: 500 25pt/1 var(--display); }
  .top .sub { margin: 4pt 0 0; font: 500 9pt/1 var(--ui); color: var(--ink-2); }
  .top .table { margin: 0; text-align: right; font: 400 8.6pt/1.45 var(--serif); color: var(--ink-2); }
  .top .table b { display: block; font: 600 6.8pt/1 var(--ui); letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 3pt; }

  .steps { display: grid; grid-template-columns: 1fr 1fr 1.42fr 1fr; gap: 0.24in; align-items: start; }
  .step .n { display: flex; align-items: center; gap: 7pt; }
  .step .n i { flex: none; display: grid; place-items: center; width: 17pt; height: 17pt; border-radius: 50%; font: 600 8.5pt/1 var(--ui); font-style: normal; color: #fff; background: var(--gold); }
  .step h2 { margin: 0; font: 500 15pt/1 var(--display); }
  .step .min { margin: 5pt 0 0 24pt; font: 600 6.8pt/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  .step p.t { margin: 6pt 0 0; font: 400 9.8pt/1.36 var(--serif); }
  .step .q { margin: 7pt 0 0; padding: 7pt 10pt 8pt; border-left: 2.5pt solid var(--gold-2); background: var(--gold-wash); border-radius: 0 5pt 5pt 0; }
  .step .q p { margin: 0; font: italic 400 9.6pt/1.36 var(--serif); }
  .step .q p + p { margin-top: 5pt; font-size: 8.8pt; color: var(--ink-2); }
  .step .q p + p b { font: 600 6.6pt/1 var(--ui); letter-spacing: 0.13em; text-transform: uppercase; font-style: normal; color: var(--gold); margin-right: 3pt; }
</style>
</head>
<body>
<script src="../data/characters.js"></script>
<script src="qr.js"></script>
<script src="print.js"></script>
<script>
(function () {
  'use strict';
  var el = P.el;
  var STEPS = [
    { name: 'Share', min: 'Eight minutes',
      text: 'Youngest first, each person says who they met and teaches their rung, motion and all. If your rung came with a question, ask it.' },
    { name: 'Build', min: 'Eight minutes',
      text: 'Write each rung on a strip, with who taught it and who said it first. Decide the order together, then glue the strips onto your ladder.' },
    { name: 'Top rung', min: 'Ten minutes',
      text: 'Talk it over, then write your family’s own rung in the gold space at the top of your ladder.',
      q: ['If angels could carry something up to God for our family, what would it be? What would we want them to bring back down?',
          'Where have we found something holy in a place we didn’t expect?'] },
    { name: 'Post it', min: 'Four minutes',
      text: 'Copy your top rung onto the gold strip, add your family’s name, and tape it to the community ladder. Your ladder goes home with you.' }
  ];

  function panel(cls) {
    return el('div', { class: 'panel ' + cls },
      el('header', { class: 'top' },
        P.ladderMark(),
        el('div', {},
          el('p', { class: 'eyebrow', text: 'Voices of the Ladder' }),
          el('h1', { text: 'Family ladders' }),
          el('p', { class: 'sub', text: 'Thirty minutes, together' })),
        el('p', { class: 'table' }, el('b', { text: 'On your table' }), 'A ladder sheet, rung strips, and a rung key', el('br'), 'Markers and a glue stick')),
      el('div', { class: 'steps' }, STEPS.map(function (s, i) {
        return el('section', { class: 'step' },
          el('div', { class: 'n' }, el('i', { text: String(i + 1) }), el('h2', { text: s.name })),
          el('p', { class: 'min', text: s.min }),
          el('p', { class: 't', text: s.text }),
          s.q ? el('div', { class: 'q' }, el('p', { text: s.q[0] }), el('p', {}, el('b', { text: 'Or, with older kids' }), s.q[1])) : null);
      })));
  }

  document.body.appendChild(el('section', { class: 'sheet landscape tent' },
    panel('upper'), panel('lower'),
    el('i', { class: 'fold l' }), el('i', { class: 'fold r' }),
    el('span', { class: 'fold-word l', text: 'Fold' }), el('span', { class: 'fold-word r', text: 'Fold' })));
})();
</script>
</body>
</html>
