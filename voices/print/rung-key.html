<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rung key · Voices of the Ladder</title>
<link rel="stylesheet" href="print.css">
<style>
  @page { size: letter; margin: 0; }
  .key { display: grid; grid-template-rows: auto 1fr auto; gap: 0.14in; padding: 0.38in 0.35in 0.3in; }
  .key::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 0.1in; background: linear-gradient(90deg, var(--k2) 0 25%, var(--g34) 25% 50%, var(--g57) 50% 75%, var(--parents) 75%); }

  .head { display: grid; grid-template-columns: 1fr auto; gap: 0.3in; align-items: end; }
  .head h1 { margin: 5pt 0 0; font: 500 25pt/1 var(--display); letter-spacing: -0.005em; }
  .head .how { margin: 6pt 0 0; font: 400 9.6pt/1.38 var(--serif); color: var(--ink-2); max-width: 5.1in; }
  .head .ladder-mark { width: 26pt; height: 44pt; color: var(--gold-2); }

  table.rungs { width: 100%; border-collapse: collapse; table-layout: fixed; align-self: start; }
  table.rungs col.who { width: 1.58in; }
  table.rungs col.c-parents { width: 1.98in; }
  .side-2 table.rungs col.who { width: 1.95in; }
  .side-2 table.rungs col.c-parents { width: 2.05in; }
  table.rungs th { padding: 0 7pt 6pt; text-align: left; vertical-align: top; border-bottom: 1.2pt solid var(--ink); }
  table.rungs th .lv { display: block; padding-top: 6pt; border-top: 4pt solid var(--lv); font: 600 10pt/1 var(--ui); color: var(--lv); }
  table.rungs th .lv-how { display: block; margin-top: 3pt; font: 400 7.2pt/1.25 var(--ui); color: var(--ink-3); }
  table.rungs th.who-h { vertical-align: bottom; padding-left: 0; font: 600 7pt/1.25 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
  table.rungs td { padding: 6.5pt 7pt 6.5pt; vertical-align: top; border-bottom: 0.6pt solid var(--line); }
  table.rungs td.none { background: repeating-linear-gradient(135deg, #faf7f0 0 4pt, #f1ebdf 4pt 4.7pt); }

  td.who-cell { padding-left: 0; vertical-align: middle; }
  .who-in { display: flex; align-items: center; gap: 7pt; }
  .who-in .nm { display: block; font: 500 11.5pt/1.05 var(--display); }
  .who-in .rl { display: block; margin-top: 3pt; font: 400 7.2pt/1.3 var(--ui); color: var(--ink-3); }

  .line { font: 500 9.3pt/1.25 var(--display); color: var(--ink); }
  .he-line { margin-top: 2.5pt; font: 400 9.6pt/1.42 var(--display); color: var(--gold); text-align: right; }
  .extra { margin-top: 3.5pt; font: italic 400 8pt/1.32 var(--serif); color: var(--ink-2); }

  .middle { display: grid; align-content: start; gap: 0.32in; }
  .more { display: grid; grid-template-columns: 1.55fr 1fr; gap: 0.3in; padding-top: 0.2in; border-top: 1.2pt solid var(--ink); }
  .more p { margin: 0; font: 400 10pt/1.5 var(--serif); }
  .more .cite { font: 600 7pt/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-left: 5pt; }
  .more ol { margin: 0; padding: 0; list-style: none; counter-reset: step; }
  .more ol li { position: relative; padding: 0 0 7pt 24pt; font: 400 10pt/1.4 var(--serif); counter-increment: step; }
  .more ol li::before { content: counter(step); position: absolute; left: 0; top: -0.5pt; width: 15pt; height: 15pt; border-radius: 50%; display: grid; place-items: center; font: 600 7.5pt/1 var(--ui); color: #fff; background: var(--gold); }
  .foot { display: grid; gap: 6pt; }
  .foot .note { margin: 0; font: italic 400 8pt/1.35 var(--serif); color: var(--ink-3); }
  .colophon { display: flex; justify-content: space-between; font: 500 7pt/1 var(--ui); color: var(--ink-3); letter-spacing: 0.02em; }
</style>
</head>
<body>
<script src="../data/characters.js"></script>
<script src="../data/portraits.js"></script>
<script src="qr.js"></script>
<script src="print.js"></script>
<script>
(function () {
  'use strict';
  var el = P.el, V = P.V;
  var how = {
    k2: 'The line, then the motion',
    g34: 'The line, then the secret',
    g57: 'The line, then a question for parents',
    parents: 'The line, then a question for your child'
  };
  var SIDES = [
    { ids: ['jacob', 'esau', 'rebekah', 'isaac', 'angel', 'stone'], levels: ['k2', 'g34', 'g57', 'parents'],
      eyebrow: 'Voices of the Ladder · Rung key', title: 'Who did you meet?', who: 'Who was there that night',
      intro: 'Find the character, then read across to your group. Every visit ends with a rung: one line to teach your family, and one more thing to go with it.',
      note: 'A shaded box means that group didn’t meet that character. The teachers are on the back.' },
    { ids: ['rashi', 'sages', 'ramban', 'rambam'], levels: ['g34', 'g57', 'parents'],
      eyebrow: 'Voices of the Ladder · Rung key, continued', title: 'The teachers', who: 'Who explains it',
      intro: 'Rashi, the Sages, Ramban, and Rambam have been explaining Jacob’s night for centuries. Grades 3–4 met Rashi and the Sages; grades 5–7 and the parents could meet all four.',
      note: 'A shaded box means that group didn’t meet that teacher.',
      story: 'Jacob tricked his father, Isaac, into giving him the blessing meant for his twin brother, Esau. Esau was so angry that their mother, Rebekah, sent Jacob away to her brother’s house, just for a few days, she said. Before he left, Isaac blessed him again, this time on purpose. On the road, Jacob stopped for the night, put a stone under his head, and dreamed: a ladder stood on the ground with its top reaching the sky, and angels of God were going up and down on it. God stood beside him and promised, “I am with you.” Jacob woke up and said, “Surely God is present in this place, and I did not know it!” He named the place Beit El, House of God.',
      listen: ['Listen all the way through.', 'Say it back together, motion and all.', 'If they ask you a question, answer it.', 'Then teach them your rung.'] }
  ];

  SIDES.forEach(function (side, n) {
    var head = el('tr', {}, el('th', { class: 'who-h', text: side.who }), side.levels.map(function (lv) {
      return el('th', { class: 'lv-' + lv }, el('span', { class: 'lv', text: V.levels[lv].label }), el('span', { class: 'lv-how', text: how[lv] }));
    }));
    var rows = side.ids.map(function (id) {
      var c = V.characters[id];
      return el('tr', {},
        el('td', { class: 'who-cell' },
          el('div', { class: 'who-in' }, P.medal(c, '0.62in'),
            el('div', {}, el('span', { class: 'nm', text: c.name }), el('span', { class: 'rl', text: P.roleFor(c, 'g57') })))),
        side.levels.map(function (lv) {
          var r = c.rung[lv];
          if (!r || V.cast[lv].indexOf(id) === -1) return el('td', { class: 'none' });
          return el('td', { class: 'lv-' + lv },
            el('div', { class: 'line', text: r.line }),
            r.he ? el('div', { class: 'he-line', lang: 'he', dir: 'rtl', text: r.he }) : null,
            r.extra ? el('div', { class: 'extra', text: r.extra }) : null);
        }));
    });
    document.body.appendChild(el('section', { class: 'sheet key side-' + (n + 1) },
      el('header', { class: 'head' },
        el('div', {},
          el('p', { class: 'eyebrow', text: side.eyebrow }),
          el('h1', { text: side.title }),
          el('p', { class: 'how', text: side.intro })),
        P.ladderMark()),
      el('div', { class: 'middle' },
        el('table', { class: 'rungs' },
          el('colgroup', {}, el('col', { class: 'who' }), side.levels.map(function (lv) { return el('col', { class: 'c-' + lv }); })),
          el('thead', {}, head),
          el('tbody', {}, rows)),
        side.story ? el('section', { class: 'more' },
          el('div', {},
            el('h2', { class: 'label' }, 'The story in brief', el('span', { class: 'cite', text: 'Genesis 27–28' })),
            el('p', { text: side.story })),
          el('div', {},
            el('h2', { class: 'label', text: 'When someone teaches you a rung' }),
            el('ol', {}, side.listen.map(function (t) { return el('li', { text: t }); })))) : null),
      el('footer', { class: 'foot' },
        el('p', { class: 'note', text: side.note }),
        el('div', { class: 'colophon' },
          el('span', { text: 'Voices of the Ladder · ' + window.PRINT_QR.k2.short.replace(/#.*$/, '') }),
          el('span', { text: 'Prepared by Rabbi Dan Medwin · Parashat Vayeitzei 5787' })))));
  });
})();
</script>
</body>
</html>
