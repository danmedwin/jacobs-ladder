<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bedtime card · Voices of the Ladder</title>
<link rel="stylesheet" href="print.css">
<style>
  @page { size: letter; margin: 0; }
  .four { padding: 0; display: grid; grid-template-columns: 4.25in 4.25in; grid-template-rows: 5.5in 5.5in; }
  .four::before, .four::after { content: ""; position: absolute; }
  .four::before { left: 4.25in; top: 0.25in; bottom: 0.25in; border-left: 0.75pt dashed #b3a78f; }
  .four::after { top: 5.5in; left: 0.25in; right: 0.25in; border-top: 0.75pt dashed #b3a78f; }

  .card { position: relative; overflow: hidden; display: grid; grid-template-rows: auto auto 1fr auto; gap: 0.06in; padding: 0.26in 0.36in 0.3in; }
  .card .eyebrow { font-size: 6.6pt; }
  .card h1 { margin: 4pt 0 0; font: 500 16pt/1.05 var(--display); }
  .card .intro { margin: 4pt 0 0; font: 400 8.2pt/1.36 var(--serif); color: var(--ink-2); }

  .words { display: grid; gap: 3pt; text-align: center; padding: 6pt 0 7pt; border-top: 0.6pt solid var(--line); border-bottom: 0.6pt solid var(--line); }
  .words .he-t { margin: 0; font: 400 11.2pt/1.45 var(--display); direction: rtl; }
  .words .tr { margin: 0; font: italic 400 7.7pt/1.3 var(--serif); color: var(--ink-2); }
  .words .en { margin: 0; font: 400 7.8pt/1.3 var(--serif); }

  /* You, in the middle, facing the top of the card */
  .hands { display: grid; align-content: center; gap: 4pt; }
  .hands .label { margin: 0; text-align: center; }
  .map { display: grid; grid-template-columns: 1fr 0.6in 1fr; grid-template-rows: auto 0.6in auto; gap: 8pt 16pt; align-items: center; justify-items: center; }
  .map .a { text-align: center; }
  .map .a.front { grid-column: 2; grid-row: 1; }
  .map .a.left { grid-column: 1; grid-row: 2; justify-self: end; text-align: right; }
  .map .a.right { grid-column: 3; grid-row: 2; justify-self: start; text-align: left; }
  .map .a.back { grid-column: 2; grid-row: 3; }
  .map .a b { display: block; font: 500 11pt/1 var(--display); white-space: nowrap; }
  .map .a em { display: block; margin-top: 2.5pt; font: italic 400 7.2pt/1.2 var(--serif); color: var(--ink-3); white-space: nowrap; }
  .map .you { grid-column: 2; grid-row: 2; position: relative; width: 0.6in; height: 0.6in; border-radius: 50%; display: grid; place-items: center; align-content: center; gap: 1.5pt; background: radial-gradient(circle at 50% 35%, #fff6df, var(--gold-wash)); box-shadow: 0 0 0 1pt var(--gold-2); }
  .map .you svg { width: 11pt; height: 11pt; color: var(--gold); }
  .map .you span { font: 600 6.4pt/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
  .map .arr { position: absolute; width: 4pt; height: 4pt; border-top: 1pt solid var(--gold); border-left: 1pt solid var(--gold); }
  .map .arr.up { top: -5.5pt; left: calc(50% - 2pt); transform: rotate(45deg); }
  .map .arr.dn { bottom: -5.5pt; left: calc(50% - 2pt); transform: rotate(225deg); }
  .map .arr.lt { left: -5.5pt; top: calc(50% - 2pt); transform: rotate(-45deg); }
  .map .arr.rt { right: -5.5pt; top: calc(50% - 2pt); transform: rotate(135deg); }
  .hands .over { margin: 2pt 0 0; font: italic 400 7.8pt/1.35 var(--serif); color: var(--ink-2); text-align: center; }
  .hands .over b { font-style: normal; font-weight: 600; color: var(--ink); }

  .bottom { display: grid; grid-template-columns: 1fr auto; gap: 8pt; align-items: end; }
  .bottom p { margin: 0; font: 400 7pt/1.35 var(--ui); color: var(--ink-3); }
  .bottom p b { display: block; margin-bottom: 1.5pt; font: 600 7.4pt/1.2 var(--ui); color: var(--ink); }
  .bottom .qr { width: 0.56in; }
</style>
</head>
<body>
<script src="../data/characters.js"></script>
<script src="../data/sources.js"></script>
<script src="qr.js"></script>
<script src="print.js"></script>
<script>
(function () {
  'use strict';
  var el = P.el, V = P.V;
  var SPARKLE = '<svg viewBox="-1 -1 2 2" aria-hidden="true"><path fill="currentColor" d="M0-1C.08-.2.2-.08 1 0 .2.08.08.2 0 1-.08.2-.2.08-1 0-.2-.08-.08-.2 0-1z"/></svg>';
  var he = V.sources.bedtime.verses[0].he;
  var dream = window.PRINT_QR.dream;

  function angel(cls, name, means) {
    return el('div', { class: 'a ' + cls }, el('b', { text: name }), el('em', { text: means }));
  }
  function card() {
    return el('article', { class: 'card' },
      el('header', {},
        el('p', { class: 'eyebrow', text: 'Voices of the Ladder · For tonight' }),
        el('h1', { text: 'Four angels for tonight' }),
        el('p', { class: 'intro', text: 'Jacob fell asleep on a stone and dreamed of angels. Many Jewish families say these words at bedtime.' })),
      el('div', { class: 'words' },
        el('p', { class: 'he-t', lang: 'he', text: he }),
        el('p', { class: 'tr', text: 'B’shem Adonai Elohei Yisrael: mimini Michael, umis’moli Gavriel, umil’fanai Uriel, ume’achorai R’fael, v’al roshi Sh’chinat El.' }),
        el('p', { class: 'en', text: 'In the name of the Eternal, the God of Israel: Michael at my right, Gavriel at my left, Uriel in front of me, R’fael behind me, and over my head, the Presence of God.' })),
      el('div', { class: 'hands' },
        el('p', { class: 'label', text: 'Say it with your hands' }),
        el('div', { class: 'map' },
          angel('front', 'Uriel', 'God is my light'),
          angel('left', 'Gavriel', 'God is my strength'),
          el('div', { class: 'you' }, P.svg(SPARKLE), el('span', { text: 'You' }),
            el('i', { class: 'arr up' }), el('i', { class: 'arr dn' }), el('i', { class: 'arr lt' }), el('i', { class: 'arr rt' })),
          angel('right', 'Michael', 'Who is like God?'),
          angel('back', 'R’fael', 'God heals')),
        el('p', { class: 'over' }, 'Reach toward each angel as you say its name. Then rest both hands on your head: ', el('b', { text: 'the Sh’chinah' }), ', God’s presence, is over you.')),
      el('footer', { class: 'bottom' },
        el('p', {}, el('b', { text: 'See Jacob’s dream in eighteen styles' }), dream.short),
        P.qr('dream')));
  }

  document.body.appendChild(el('section', { class: 'sheet four' }, card(), card(), card(), card()));
})();
</script>
</body>
</html>
