<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voices of the Ladder</title>
<meta name="description" content="Students meet the people of Jacob's night at Bethel, and the teachers who have explained it ever since. Four versions: grades K–2, 3–4, 5–7, and parents.">
<!-- Keeps search engines from listing the page while it is still being built. Delete this line when it should be findable. -->
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
  /* One deliberate look: the night at Bethel. Every room is the same night, seen from a different place. */
  :root {
    color-scheme: dark;
    --night: #0b0d19;
    --night-2: #10142a;
    --night-3: #181d38;
    --line: rgba(236, 228, 212, 0.14);
    --line-2: rgba(236, 228, 212, 0.3);
    --parchment: #ede5d3;
    --parchment-2: #d6cbb3;
    --stone: #a9a18f;
    --ink: #1b1812;
    --ink-2: #4a4234;
    --ink-3: #6b6150;
    --gold: #e2b563;
    --gold-deep: #8a6420;
    --gold-wash: rgba(226, 181, 99, 0.16);
    --display: "Frank Ruhl Libre", "Noto Serif Hebrew", "Times New Roman", Georgia, serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --kid: "Andika", "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
    --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --room: #121a38;
    --room-2: #23306a;
    --accent: #e2b563;
    --speech-font: var(--serif);
    --speech: 1.3rem;
  }
  body.lvl-k2 { --speech-font: var(--kid); --speech: clamp(1.4rem, 1.05rem + 1.35vw, 2.3rem); }
  body.lvl-g34 { --speech-font: var(--kid); --speech: clamp(1.25rem, 0.95rem + 1.05vw, 1.95rem); }
  body.lvl-g57 { --speech-font: var(--serif); --speech: clamp(1.15rem, 0.9rem + 0.8vw, 1.65rem); }
  body.lvl-parents { --speech-font: var(--serif); --speech: clamp(1.05rem, 0.88rem + 0.6vw, 1.45rem); }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  html { background: var(--night); }
  body {
    margin: 0;
    background: var(--night);
    color: var(--parchment);
    font: 400 16px/1.5 var(--ui);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  [lang="he"] { font-family: var(--display); }

  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #app { position: relative; z-index: 1; height: 100%; }
  .scroll { height: 100%; overflow-y: auto; }
  .page { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 48px); padding-block: 0 56px; }

  /* Shared type */
  .eyebrow { margin: 0; font: 500 0.76rem/1.2 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  .muted { color: var(--stone); }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 0.5em;
    padding: 0.72em 1.15em; border-radius: 999px;
    border: 1px solid var(--line-2); background: rgba(11, 13, 25, 0.35);
    font: 500 0.95rem/1.1 var(--ui); text-decoration: none; cursor: pointer;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: transparent; color: #17120a; font-weight: 600; padding: 0.8em 1.45em; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--parchment-2); padding-inline: 0.6em; }
  .btn.quiet:hover { color: var(--parchment); }
  .btn svg, .mission svg { flex: none; width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; }
  .kbd { font: 500 0.72rem/1 var(--ui); padding: 0.28em 0.45em; border-radius: 4px; border: 1px solid currentColor; opacity: 0.7; }

  /* Top bar used by grid, opening, rungs */
  .bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding-block: 18px; border-bottom: 1px solid var(--line); margin-bottom: clamp(20px, 4vh, 40px);
  }
  .bar .title { font: 500 1.15rem/1.2 var(--display); }
  .bar .spacer { flex: 1; }

  /* Landing */
  .mast { display: grid; gap: 14px; padding-block: clamp(36px, 8vh, 96px) clamp(28px, 5vh, 48px); }
  .mast h1 { margin: 0; font: 500 clamp(2.7rem, 7vw, 5rem)/0.98 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
  .mast .he-title { margin: 0; font: 400 clamp(1.5rem, 3vw, 2.3rem)/1.2 var(--display); color: var(--gold); text-align: left; }
  .mast .lede { margin: 6px 0 0; max-width: 60ch; font: 400 clamp(1.05rem, 1.5vw, 1.25rem)/1.6 var(--serif); color: var(--parchment-2); }
  .versions { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .vcard {
    display: grid; align-content: start; gap: 12px; padding: 22px 22px 20px;
    border: 1px solid var(--line); border-radius: 12px; background: rgba(16, 20, 42, 0.78);
    text-decoration: none; transition: border-color 0.2s, transform 0.2s;
  }
  .vcard:hover { border-color: var(--gold); transform: translateY(-2px); }
  .vcard h2 { margin: 0; font: 500 2rem/1.05 var(--display); }
  .vcard p { margin: 0; font: 400 0.98rem/1.5 var(--ui); color: var(--parchment-2); }
  .mini-medals { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 2px 0; }
  .mini-medal { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(110% 90% at 50% 25%, var(--c2), var(--c1)); box-shadow: 0 0 0 1.5px var(--c3); }
  .aux { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); }
  .keys { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 400 0.9rem/1.4 var(--ui); color: var(--stone); }
  .keys span { display: inline-flex; gap: 6px; align-items: center; }

  /* The cast: each character in a medallion with a double gold ring */
  .cast { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); gap: clamp(18px, 2.4vw, 32px) clamp(12px, 2vw, 26px); }
  @media (max-width: 980px) { .cast { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }
  .tile { display: grid; grid-row: span 5; grid-template-rows: subgrid; align-content: start; row-gap: 8px; text-decoration: none; text-align: center; }
  .tile > * { align-self: start; }
  .tile:hover .medal { transform: translateY(-3px); }
  .medal {
    position: relative; aspect-ratio: 1; width: calc(100% - 14px); margin: 7px auto; border-radius: 50%; overflow: hidden;
    background: radial-gradient(110% 90% at 50% 25%, var(--room-2), var(--room));
    border: 2px solid var(--accent);
    outline: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 4px;
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
    display: grid; place-items: center; transition: transform 0.2s;
  }
  .medal img { width: 100%; height: 100%; object-fit: cover; }
  .medal-he { font: 500 clamp(1.3rem, 2.4vw, 2.2rem)/1.15 var(--display); color: var(--accent); padding: 0 14%; text-align: center; }
  .tile-name { font: 500 1.35rem/1.1 var(--display); }
  .tile-role { font: 500 0.68rem/1.3 var(--ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .tile-tease { margin: 0; font: italic 400 0.98rem/1.4 var(--serif); color: var(--parchment-2); text-wrap: balance; }
  .tile.soon .medal { filter: saturate(0.55) brightness(0.8); }
  .soon-tag { justify-self: center; font: 500 0.66rem/1 var(--ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone); border: 1px solid var(--line-2); border-radius: 99px; padding: 0.4em 0.7em; }
  .grid-head { display: grid; gap: 8px; margin-bottom: clamp(20px, 4vh, 36px); }
  .grid-head h1 { margin: 0; font: 500 clamp(2rem, 4.2vw, 3.2rem)/1.05 var(--display); text-wrap: balance; }
  .grid-head .desc { margin: 0; max-width: 62ch; font: 400 1.05rem/1.55 var(--serif); color: var(--parchment-2); }

  /* Opening screen for the big TV */
  .opening h1 { margin: 0; font: 500 clamp(2.6rem, 6vw, 5rem)/1 var(--display); text-wrap: balance; }
  .opening .sub { margin: 10px 0 clamp(26px, 5vh, 48px); font: 400 clamp(1.15rem, 2vw, 1.6rem)/1.45 var(--serif); color: var(--parchment-2); max-width: 44ch; }
  .opening .mission { margin-top: clamp(26px, 5vh, 48px); display: flex; align-items: center; gap: 18px; font: 500 clamp(1.2rem, 2.2vw, 1.8rem)/1.3 var(--display); color: var(--gold); }
  .opening .mission svg { width: 44px; height: 44px; stroke: var(--gold); stroke-width: 3; }
  .opening .cast { row-gap: 14px; }
  .opening .medal-he { font-size: clamp(0.9rem, 1.45vw, 1.9rem); padding: 0 10%; }
  .opening .tile-name { font-size: clamp(1rem, 1.35vw, 1.5rem); }

  /* Visit room */
  .visit {
    height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    background:
      radial-gradient(90% 70% at 18% 30%, color-mix(in srgb, var(--room-2) 55%, transparent), transparent 70%),
      linear-gradient(180deg, color-mix(in srgb, var(--room) 86%, transparent), color-mix(in srgb, var(--room) 97%, #000));
  }
  .vtop { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 12px clamp(16px, 3vw, 32px); border-bottom: 1px solid var(--line); }
  .vtop .who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .vtop .who b { font: 500 1.3rem/1.1 var(--display); }
  .vtop .who [lang="he"] { font-size: 1.2rem; color: var(--accent); }
  .vtop .who .role { font: 500 0.7rem/1 var(--ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone); }
  .badge { font: 600 0.72rem/1 var(--ui); letter-spacing: 0.1em; text-transform: uppercase; color: #17120a; background: var(--accent); border-radius: 99px; padding: 0.45em 0.8em; }
  .vtop .spacer { flex: 1; }
  .vmain { display: grid; grid-template-columns: minmax(180px, 24%) 30px minmax(0, 1fr); gap: clamp(12px, 2vw, 30px); padding-inline: clamp(16px, 3vw, 40px); min-height: 0; }
  .vportrait { align-self: center; display: grid; gap: 12px; justify-items: center; text-align: center; }
  .vportrait .tile-name { font-size: clamp(1.4rem, 2vw, 1.9rem); }
  .rail { position: relative; align-self: stretch; margin-block: 26px; }
  .rail::before, .rail::after { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line-2); border-radius: 2px; }
  .rail::before { left: 4px; } .rail::after { right: 4px; }
  .rungs { position: absolute; inset: 0; display: flex; flex-direction: column-reverse; justify-content: space-between; padding-block: 4px; }
  .rungs i { display: block; height: 3px; margin-inline: 4px; border-radius: 2px; background: var(--line-2); transition: background-color 0.3s; }
  .rungs i.done { background: color-mix(in srgb, var(--accent) 70%, transparent); }
  .rungs i.now { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .rungs i.goal { height: 5px; }
  .convo { overflow-y: auto; padding-block: 24px 30px; padding-inline: 2px 6px; display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 820px) {
    .vmain { grid-template-columns: minmax(0, 1fr); }
    .vportrait, .rail { display: none; }
  }

  /* Conversation items */
  .item { animation: rise 0.28s ease-out both; }
  .item.old { opacity: 0.6; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .still .item { animation: none; }
  .b-char { align-self: flex-start; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: end; max-width: min(40em, 96%); }
  .av {
    width: 48px; height: 48px; border-radius: 50%; overflow: hidden;
    background: radial-gradient(110% 90% at 50% 25%, var(--room-2), var(--room));
    border: 1.5px solid var(--accent);
    display: grid; place-items: center;
  }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .av.ghost { visibility: hidden; }
  .av .star { width: 7px; height: 7px; background: var(--accent); transform: rotate(45deg); }
  .bubble {
    background: var(--parchment); color: var(--ink);
    padding: 0.62em 0.95em 0.72em; border-radius: 20px 20px 20px 6px;
    font: 400 var(--speech)/1.38 var(--speech-font);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
  }
  .bubble i { font-style: italic; }
  .bubble .he-inline { display: block; margin: 0.2em 0; font-size: 1.15em; line-height: 1.7; text-align: right; }
  .b-char.asking .bubble { box-shadow: 0 0 0 3px var(--accent), 0 10px 28px rgba(0, 0, 0, 0.28); }
  .srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0.55em; }
  .src {
    display: inline-flex; align-items: center; gap: 0.45em; cursor: pointer;
    font: 500 0.78rem/1 var(--ui); letter-spacing: 0.02em; color: var(--ink-2);
    background: rgba(27, 24, 18, 0.06); border: 1px solid rgba(27, 24, 18, 0.18); border-radius: 99px; padding: 0.42em 0.72em;
  }
  .src:hover { background: rgba(27, 24, 18, 0.12); }
  .src svg { flex: none; width: 12px; height: 12px; stroke: currentColor; }
  .src > span { text-align: left; line-height: 1.25; }
  .src .tag { white-space: nowrap; color: var(--ink-3); }
  .b-group { align-self: flex-end; max-width: min(34em, 88%); text-align: right; }
  .b-group .label { font: 600 0.68rem/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .b-group .bubble { display: inline-block; text-align: left; background: rgba(11, 13, 25, 0.45); color: var(--parchment); border: 1.5px solid var(--accent); border-radius: 20px 20px 6px 20px; box-shadow: none; }
  .b-tip { align-self: flex-start; margin-left: 60px; max-width: 46em; font: italic 400 0.95rem/1.45 var(--ui); color: var(--parchment-2); }
  .b-tip b { font-style: normal; font: 600 0.66rem/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-right: 8px; }
  .b-media { align-self: flex-start; margin-left: 60px; width: min(620px, calc(100% - 60px)); }
  .b-media video, .b-media img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; border: 1px solid var(--line-2); background: var(--night-3); }
  .cap { margin-top: 6px; font: 400 0.82rem/1.4 var(--ui); color: var(--stone); }
  .b-gallery { align-self: flex-start; margin-left: 60px; width: min(620px, calc(100% - 60px)); }
  .b-gallery .grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .b-gallery figure { margin: 0; }
  .b-gallery img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; border: 1px solid var(--line-2); }
  .b-gallery figcaption { margin-top: 4px; font: 400 0.78rem/1.3 var(--ui); color: var(--stone); }
  .b-motion {
    align-self: center; width: min(40em, 100%); margin-block: 6px;
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center;
    padding: 18px 22px; border: 2px dashed var(--accent); border-radius: 18px; background: rgba(0, 0, 0, 0.2);
  }
  .b-motion svg { width: clamp(52px, 6vw, 76px); height: clamp(52px, 6vw, 76px); stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .b-motion .mt { font: 700 calc(var(--speech) * 1.02)/1.1 var(--kid); color: var(--accent); }
  .b-motion .mx { margin-top: 4px; font: 400 var(--speech)/1.35 var(--kid); color: var(--parchment); }
  /* Count it: a gematria card, read right to left */
  .b-count { align-self: center; width: min(40em, 100%); margin-block: 6px; padding: 18px 22px 20px; border: 2px dashed var(--accent); border-radius: 18px; background: rgba(0, 0, 0, 0.2); }
  .b-count .mt { font: 700 calc(var(--speech) * 1.02)/1.1 var(--kid); color: var(--accent); }
  .b-count .mx { margin-top: 4px; font: 400 calc(var(--speech) * 0.86)/1.35 var(--kid); color: var(--parchment); }
  .count-rows { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 18px; align-items: center; margin-top: 16px; }
  .count-row { display: contents; }
  .cw { display: grid; gap: 4px; justify-items: start; }
  .cw [lang="he"] { font: 500 calc(var(--speech) * 1.5)/1 var(--display); color: var(--parchment); }
  .cw small { font: 500 0.8rem/1.2 var(--ui); letter-spacing: 0.04em; color: var(--stone); }
  .lts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .lt { display: grid; justify-items: center; gap: 2px; min-width: 2.7em; padding: 7px 8px 6px; border-radius: 10px; background: var(--parchment); color: var(--ink); }
  .lt b { font: 500 calc(var(--speech) * 1.2)/1 var(--display); }
  .lt i { font: 600 0.82rem/1.1 var(--ui); font-style: normal; color: var(--ink-2); }
  .lt.sum { background: transparent; color: var(--accent); border: 2px solid var(--accent); padding-block: 12px; }
  .op { font: 600 calc(var(--speech) * 0.9)/1 var(--ui); color: var(--accent); }
  @media (max-width: 560px) {
    .count-rows { grid-template-columns: 1fr; gap: 6px; }
    .count-row .lts { margin-bottom: 10px; }
    .lts { gap: 5px; }
    .lt { min-width: 0; padding: 6px 7px 5px; }
    .lt b { font-size: calc(var(--speech) * 1.05); }
  }
  .b-rung {
    align-self: stretch; position: relative; margin-block: 10px;
    padding: 20px clamp(26px, 4vw, 48px) 22px; border-radius: 6px;
    background: linear-gradient(180deg, rgba(226, 181, 99, 0.16), rgba(226, 181, 99, 0.05));
  }
  .b-rung::before, .b-rung::after { content: ""; position: absolute; top: -10px; bottom: -10px; width: 6px; border-radius: 3px; background: linear-gradient(180deg, var(--gold-deep), var(--gold), var(--gold-deep)); }
  .b-rung::before { left: 6px; } .b-rung::after { right: 6px; }
  .rung-eyebrow { display: flex; align-items: center; gap: 10px; font: 600 0.72rem/1 var(--ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
  .rung-bar { height: 12px; margin: 14px -30px 16px; border-radius: 6px; background: linear-gradient(90deg, var(--gold-deep), var(--gold) 20%, #f3d593 50%, var(--gold) 80%, var(--gold-deep)); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35); }
  .rung-line { font: 500 calc(var(--speech) * 1.22)/1.18 var(--display); text-wrap: balance; }
  .rung-he { margin-top: 6px; font: 400 calc(var(--speech) * 1.05)/1.6 var(--display); color: var(--gold); text-align: right; }
  .rung-extra { margin-top: 12px; display: grid; gap: 4px; }
  .rung-extra .k { font: 600 0.7rem/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  .rung-extra .v { font: 400 calc(var(--speech) * 0.86)/1.4 var(--speech-font); color: var(--parchment); }
  .rung-say { margin-top: 14px; font: italic 400 0.95rem/1.4 var(--ui); color: var(--parchment-2); }
  .b-end { align-self: stretch; margin-top: 4px; }
  .b-end .row { display: flex; flex-wrap: wrap; gap: 14px; }
  .b-end a.mini { display: grid; grid-template-columns: 44px auto; gap: 12px; align-items: center; padding: 10px 16px 10px 10px; border: 1px solid var(--line-2); border-radius: 14px; text-decoration: none; background: rgba(11, 13, 25, 0.4); }
  .b-end a.mini:hover { border-color: var(--accent); }
  .b-end a.mini .av { width: 44px; height: 44px; }
  .b-end a.mini b { display: block; font: 500 1.15rem/1.1 var(--display); }
  .b-end a.mini span { font: 400 0.85rem/1.3 var(--ui); color: var(--stone); }

  /* Dock: the teacher's controls */
  .dock {
    position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 12px clamp(16px, 3vw, 32px) calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line); background: rgba(6, 8, 16, 0.62); backdrop-filter: blur(8px);
  }
  .dock .spacer { flex: 1; }
  .dock .hint { font: 400 0.88rem/1.3 var(--ui); color: var(--stone); }
  @media (max-width: 600px) { .dock .hint { display: none; } }
  /* The group's turn: choices and questions sit in the conversation, on the group's side */
  .b-reply {
    align-self: flex-end; width: min(46em, 94%); display: grid; gap: 12px; padding: 14px 16px 16px;
    border: 1.5px dashed color-mix(in srgb, var(--accent) 70%, transparent); border-radius: 20px 20px 6px 20px;

  /* ---------- The conversation engine ----------

  function play(beats, inputs, c, lv) {

        st.items.push({ k: 'group', label: 'We said', text: ch.label });
        st.wait = null; replies(ch.reply);
      } else if (inp.t === 'skip' && w && w.type === 'choice') {
        st.wait = null; beat();
      } else if (inp.t === 'q' && w && w.type === 'questions' && !st.queue.length) {
        var q = w.b.questions[inp.i]; if (!q) return;
        st.used[inp.i] = true;
        st.items.push({ k: 'group', label: 'We asked', text: inp.text || q.q });
        replies(q.a);
      } else if (inp.t === 'done' && w && w.type === 'questions' && !st.queue.length) {
        st.wait = null; beat();
      }
    }
    beat();
    inputs.forEach(apply);
    return st;
  }
  function mode(st, beats) {
    if (st.queue.length) return 'next';
    if (!st.wait) return st.bi < beats.length ? 'next' : 'end';
    return st.wait.type;
  }

  /* Matching typed questions to the prepared ones */
  var STOP = ('a an the and or but if of to in on at for with about from by is are was were be been being do did does done ' +
    'you your yours i me my we us our it its that this what why how who when where which can could would should will just so ' +
    'very really there their then than did have has had any some much many ever also not no yes tell please').split(' ');
  function words(s) {
    return String(s).toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9\s]/g, ' ').split(/\s+/)
      .filter(function (w) { return w && STOP.indexOf(w) === -1; })
      .map(function (w) { return w.length > 4 ? w.replace(/(ing|ed|es|s)$/, '') : w; });
  }
  function matches(text, questions) {
    var want = words(text);
    if (!want.length) return [];
    return questions.map(function (q, i) {
      var qa = words(q.q), qk = words(q.keys || '');
      var score = 0;
      want.forEach(function (w) {
        if (qa.indexOf(w) !== -1) score += 2;
        else if (qk.indexOf(w) !== -1) score += 1.5;
        else if (w.length > 3 && qa.concat(qk).some(function (x) { return x.length > 3 && (x.indexOf(w) === 0 || w.indexOf(x) === 0); })) score += 0.8;
      });
      return { i: i, score: score / Math.sqrt(want.length + 1) };
    }).filter(function (m) { return m.score >= 0.9; })
      .sort(function (a, b) { return b.score - a.score; }).slice(0, 3);
  }

  /* ---------- A visit ---------- */
  function showVisit(lv, id) {
    var c = V.characters[id];
    var L = V.levels[lv];
    document.title = c.name + ' · ' + L.label + ' · Voices of the Ladder';
    var script = V.scripts[id] && V.scripts[id][lv];

    var top = el('header', { class: 'vtop' },
      el('a', { class: 'btn quiet', href: '#' + lv }, '← All characters'),
      el('div', { class: 'who' },
        el('b', { text: c.name }), el('span', { lang: 'he', dir: 'rtl', text: c.he }),
        el('span', { class: 'role', text: roleFor(c, lv) })),
      el('span', { class: 'spacer' }),
      el('span', { class: 'badge', text: L.short }));
    var portrait = el('aside', { class: 'vportrait' }, medal(c), el('div', { class: 'tile-name', text: c.name }),
      el('div', { class: 'tile-role', text: roleFor(c, lv) }));
    var room = el('div', { class: 'visit', style: roomVars(c) });
    app.appendChild(room);

    if (!script) {
      var r = c.rung[lv];
      room.appendChild(top);
      room.appendChild(el('div', { class: 'vmain' }, portrait, el('div'),
        el('section', { class: 'soon-room' },
          el('p', { class: 'eyebrow', text: 'Coming soon' }),
          el('h2', { text: '“' + (c.tease[lv] || '') + '”' }),
          el('p', { class: 'desc', text: atStart(whose(c)) + ' ' + L.short + ' visit is still being written. Here is the rung it will end with.' }),
          rungCard(r, lv))));
      room.appendChild(el('footer', { class: 'dock' }, el('span', { class: 'spacer' }), el('a', { class: 'btn primary', href: '#' + lv }, 'Back to all characters')));
      return;
    }

    var beats = script.beats;
    var key = 'voices.visit.' + lv + '.' + id;
    var inputs = session.get(key, []);
    var shown = 0;
    var rungs = el('div', { class: 'rungs' });
    var convo = el('section', { class: 'convo', 'aria-live': 'polite', 'aria-label': 'Conversation with ' + inText(c) });
    var dock = el('footer', { class: 'dock' });
    room.appendChild(top);
    room.appendChild(el('div', { class: 'vmain' }, portrait, el('div', { class: 'rail', 'aria-hidden': 'true' }, rungs), convo));
    room.appendChild(dock);

    var st = null;
    function update(animate) {
      st = play(beats, inputs, c, lv);
      session.set(key, inputs);
      drawConvo(animate);
      drawRail();
      drawDock();
      if (st.items.some(function (it) { return it.k === 'rung'; })) saveRung(lv, id);
    }
    function act(inp) { inputs.push(inp); update(true); }
    function back() { if (inputs.length) { inputs.pop(); update(false); } }

    var replyCard = null;
    function drawConvo(animate) {
      var items = st.items;
      if (replyCard) { replyCard.remove(); replyCard = null; }
      if (!animate || items.length < shown) { convo.innerHTML = ''; shown = 0; convo.classList.add('still'); }
      else convo.classList.remove('still');
      for (var i = shown; i < items.length; i++) convo.appendChild(renderItem(items[i], items[i - 1]));
      shown = items.length;
      var nodes = convo.children, lastGroup = nodes.length - 1;
      while (lastGroup > 0 && nodes[lastGroup].dataset.k === 'tip') lastGroup--;
      for (var j = 0; j < nodes.length; j++) nodes[j].classList.toggle('old', j < lastGroup - 2);
      var m = mode(st, beats);
      if (m === 'choice' || m === 'questions') { replyCard = renderReply(m); convo.appendChild(replyCard); }
      stick(animate);
    }
    /* The group's turn: answer buttons or question buttons, at the end of the conversation */
    function renderReply(m) {
      var b = st.wait.b;
      var card = el('div', { class: 'item b-reply', 'data-k': 'card' });
      if (m === 'choice') {
        card.appendChild(el('div', { class: 'label', text: 'What did the group say?' }));
        card.appendChild(el('div', { class: 'reply-grid' }, b.choices.map(function (ch, i) {
          return el('button', { class: 'choice', type: 'button', onclick: function () { act({ t: 'choice', i: i }); } },
            el('span', { class: 'n', text: String(i + 1) }), ch.label);
        })));
        return card;
      }
      card.appendChild(el('div', { class: 'label', text: 'Ask ' + inText(c) + ' a question' }));
      card.appendChild(el('div', { class: 'reply-grid' }, b.questions.map(function (q, i) {
        return el('button', { class: 'chip' + (st.used[i] ? ' used' : ''), type: 'button', onclick: function () { act({ t: 'q', i: i }); } },
          el('span', { class: 'n', text: String(i + 1) }), q.q);
      })));
      if (b.typing) card.appendChild(askForm(b));
      return card;
    }
    function stick(smooth) {
      requestAnimationFrame(function () {
        var gap = convo.scrollHeight - convo.clientHeight - convo.scrollTop;
        var glide = smooth && !reduceMotion && gap < convo.clientHeight * 0.8;
        convo.scrollTo({ top: convo.scrollHeight, behavior: glide ? 'smooth' : 'auto' });
      });
    }
    function renderItem(it, prev) {
      var node;
      if (it.k === 'char') {
        var bubble = el('div', { class: 'bubble', html: it.html });
        var srcs = it.src ? [].concat(it.src) : [];
        if (srcs.length) bubble.appendChild(el('div', { class: 'srcs' }, srcs.map(srcChip)));
        var ghost = prev && prev.k === 'char';
        node = el('div', { class: 'item b-char' + (it.asking ? ' asking' : '') }, avatar(c, ghost), bubble);
      } else if (it.k === 'group') {
        node = el('div', { class: 'item b-group' }, el('div', { class: 'label', text: it.label }), el('div', { class: 'bubble', text: it.text }));
      } else if (it.k === 'tip') {
        node = el('div', { class: 'item b-tip' }, el('b', { text: 'Teacher' }), it.text);
      } else if (it.k === 'motion') {
        node = el('div', { class: 'item b-motion' }, icon(it.icon), el('div', {}, el('div', { class: 'mt', text: it.title }), el('div', { class: 'mx', text: it.text })));
      } else if (it.k === 'count') {
        node = el('div', { class: 'item b-count' }, el('div', { class: 'mt', text: it.count.title }),
          it.count.text ? el('div', { class: 'mx', text: it.count.text }) : null,
          el('div', { class: 'count-rows', dir: 'rtl' }, it.count.rows.map(function (r) {
            var tiles = [];
            r.letters.forEach(function (l, i) {
              if (i) tiles.push(el('span', { class: 'op', text: '+' }));
              tiles.push(el('span', { class: 'lt' }, el('b', { lang: 'he', text: l[0] }), el('i', { text: String(l[1]) })));
            });
            tiles.push(el('span', { class: 'op', text: '=' }), el('span', { class: 'lt sum' }, el('b', { text: '?' })));
            return el('div', { class: 'count-row' },
              el('div', { class: 'cw' }, el('span', { lang: 'he', text: r.he }), el('small', { dir: 'ltr', text: r.en })),
              el('div', { class: 'lts' }, tiles));
          })));
      } else if (it.k === 'media') {
        node = el('figure', { class: 'item b-media' }, media(it.style), el('figcaption', { class: 'cap', text: (V.styles[it.style] || it.style) + ' · from the Jacob’s Dream gallery' }));
      } else if (it.k === 'gallery') {
        node = el('div', { class: 'item b-gallery' },
          el('div', { class: 'grid4' }, it.styles.map(function (s) {
            return el('figure', {}, el('img', { src: MEDIA + 'thumb/' + s + '.jpg', alt: (V.styles[s] || s) + ' version of Jacob’s dream', onload: function () { stick(false); } }),
              el('figcaption', { text: V.styles[s] || s }));
          })),
          it.caption ? el('div', { class: 'cap', text: it.caption }) : null);
      } else if (it.k === 'rung') {
        node = rungCard(it.rung, lv, true);
      } else if (it.k === 'end') {
        node = el('div', { class: 'item b-end' }, el('div', { class: 'row' }, it.ids.map(function (nid) {
          var n = V.characters[nid];
          if (!n || V.cast[lv].indexOf(nid) === -1) return null;
          return el('a', { class: 'mini', href: '#' + lv + '.' + nid, style: roomVars(n) }, avatar(n),
            el('div', {}, el('b', { text: n.name }), el('span', { text: roleFor(n, lv) })));
        })));
      }
      node.dataset.k = it.k;
      return node;
    }
    function media(style) {
      if (reduceMotion) return el('img', { src: MEDIA + 'poster/' + style + '.jpg', alt: 'Jacob’s dream, ' + (V.styles[style] || style), onload: function () { stick(false); } });
      var v = el('video', { src: MEDIA + 'loop-sm/' + style + '.mp4', poster: MEDIA + 'poster/' + style + '.jpg',
        muted: true, autoplay: true, loop: true, playsinline: true, 'aria-label': 'Jacob’s dream, ' + (V.styles[style] || style),
        onloadeddata: function () { stick(false); } });
      v.muted = true;
      return v;
    }
    function drawRail() {
      rungs.innerHTML = '';
      for (var i = 0; i < beats.length; i++) {
        var cls = i < st.bi - 1 ? 'done' : i === st.bi - 1 ? 'now' : '';
        if (beats[i].rung) cls += ' goal';
        rungs.appendChild(el('i', { class: cls }));
      }
    }
    function drawDock() {
      dock.innerHTML = '';
      var m = mode(st, beats);
      var spacer = function () { return el('span', { class: 'spacer' }); };
      dock.appendChild(el('button', { class: 'btn quiet', type: 'button', onclick: back, disabled: !inputs.length, 'aria-label': 'Back one step' }, '← Back'));
      if (m === 'next') {
        dock.appendChild(spacer());
        dock.appendChild(el('button', { class: 'btn primary', type: 'button', 'data-primary': 'next', onclick: function () { act({ t: 'next' }); } }, 'Next', el('span', { class: 'kbd', text: 'Space' })));
      } else if (m === 'choice') {
        dock.appendChild(el('span', { class: 'hint', text: 'Choose above, or press 1–' + st.wait.b.choices.length + '.' }));
        dock.appendChild(spacer());
        dock.appendChild(el('button', { class: 'btn quiet', type: 'button', onclick: function () { act({ t: 'skip' }); } }, 'Skip'));
      } else if (m === 'reveal') {
        dock.appendChild(el('span', { class: 'hint', text: 'Talk it over first.' }));
        dock.appendChild(spacer());
        dock.appendChild(el('button', { class: 'btn primary', type: 'button', 'data-primary': 'reveal', onclick: function () { act({ t: 'next' }); } }, 'Hear ' + whose(c) + ' answer', el('span', { class: 'kbd', text: 'Space' })));
      } else if (m === 'questions') {
        dock.appendChild(el('span', { class: 'hint', text: 'Choose a question above, or press 1–' + st.wait.b.questions.length + '.' }));
        dock.appendChild(spacer());
        dock.appendChild(el('button', { class: 'btn primary', type: 'button', onclick: function () { act({ t: 'done' }); } }, 'Done asking →'));
      } else if (m === 'end') {
        dock.appendChild(spacer());
        dock.appendChild(el('a', { class: 'btn', href: '#' + lv + '.rungs' }, icon('ladder'), 'Our rungs'));
        dock.appendChild(el('a', { class: 'btn primary', href: '#' + lv }, 'All characters'));
      }
    }
    /* Typed questions (5–7 and parents) are matched to the prepared ones, inside the reply card */
    function askForm(b) {
      var results = el('div', { class: 'ask-results', hidden: true });
      var input = el('input', { id: 'ask-' + lv + '-' + id, type: 'text', placeholder: 'Or type your own question…', autocomplete: 'off', 'aria-label': 'Type a question for ' + inText(c) });
      var form = el('form', { class: 'ask-row', onsubmit: function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text) return;
        var found = matches(text, b.questions);
        results.innerHTML = '';
        results.appendChild(el('div', { class: 'label', text: found.length ? 'Did you mean…' : 'No prepared answer' }));
        if (found.length) {
          results.appendChild(el('div', { class: 'reply-grid' }, found.map(function (f) {
            return el('button', { class: 'chip', type: 'button', onclick: function () { act({ t: 'q', i: f.i, text: text }); } }, b.questions[f.i].q);
          })));
        }
        results.appendChild(el('p', { text: found.length ?
          'Choose the closest question, and ' + inText(c) + ' will answer it.' :
          atStart(inText(c)) + (c.plural ? ' don’t' : ' doesn’t') + ' have a prepared answer for that yet. When Ask anything is set up, it will answer questions like this one, marked as an imagined answer.' }));
        results.hidden = false;
        stick(true);
      } }, input, el('button', { class: 'btn', type: 'submit' }, 'Ask'));
      return el('div', { class: 'ask-wrap' }, form, results);
    }

    function onKey(e) {
      if (sheetOpen() || practiceOpen) return;
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      var m = mode(st, beats);
      if (e.key === 'ArrowLeft') { e.preventDefault(); back(); return; }
      if (e.key === 'ArrowRight' || ((e.key === ' ' || e.key === 'Enter') && tag !== 'BUTTON' && tag !== 'A')) {
        if (m === 'next' || m === 'reveal') { e.preventDefault(); act({ t: 'next' }); }
        return;
      }
      if (/^[1-9]$/.test(e.key)) {
        var i = +e.key - 1;
        if (m === 'choice' && st.wait.b.choices[i]) act({ t: 'choice', i: i });
        else if (m === 'questions' && st.wait.b.questions[i]) act({ t: 'q', i: i });
      }
    }
    addEventListener('keydown', onKey);
    teardown = function () {
      removeEventListener('keydown', onKey);
      room.querySelectorAll('video').forEach(function (v) { try { v.pause(); } catch (e) { /* ignore */ } });
    };
    update(false);
  }

  /* ---------- The rung card ---------- */
  function rungCard(r, lv, asItem) {
    if (!r) return null;
    var L = V.levels[lv];
    return el('div', { class: (asItem ? 'item ' : '') + 'b-rung' },
      el('div', { class: 'rung-eyebrow' }, 'A rung to carry back to your family'),
      el('div', { class: 'rung-bar', 'aria-hidden': 'true' }),
      el('div', { class: 'rung-line', text: r.line }),
      r.he ? el('div', { class: 'rung-he', lang: 'he', dir: 'rtl', text: r.he }) : null,
      r.extra ? el('div', { class: 'rung-extra' }, el('span', { class: 'k', text: L.extraLabel }), el('span', { class: 'v', text: r.extra })) : null,
      el('div', { class: 'rung-say', text: lv === 'parents' ? 'Say it once out loud, so you remember it word for word.' : 'Say it together three times, so everyone remembers it.' }));
  }

  /* ---------- Our rungs ---------- */
  var practiceOpen = false;
  function showRungs(lv) {
    var L = V.levels[lv];
    document.title = 'Our rungs · ' + L.label + ' · Voices of the Ladder';
    var ids = getRungs(lv).filter(function (id) { return V.characters[id] && V.characters[id].rung[lv]; });
    var confirming = false;
    var clearBtn = el('button', { class: 'btn quiet', type: 'button', onclick: function () {
      if (!confirming) { confirming = true; clearBtn.textContent = 'Tap again to clear for the next group'; return; }
      local.del(rungKey(lv));
      Object.keys(V.characters).forEach(function (id) { session.del('voices.visit.' + lv + '.' + id); });
      route();
    } }, 'Clear for the next group');
    var list = ids.length ? el('div', { class: 'ladder' }, ids.map(function (id) {
      var c = V.characters[id], r = c.rung[lv];
      return el('div', { class: 'rrow', style: roomVars(c) }, avatar(c),
        el('div', {}, el('div', { class: 'nm', text: c.name }), el('div', { class: 'ln', text: r.line }),
          r.he ? el('div', { class: 'rung-he', lang: 'he', dir: 'rtl', text: r.he }) : null,
          r.extra ? el('div', { class: 'ex' }, el('b', { text: L.extraLabel }), r.extra) : null));
    })) : el('p', { class: 'empty', text: 'No rungs yet. Every visit ends with a rung, and it will appear here.' });
    var onKey = function (e) { if (e.key === 'Escape' && practiceOpen) closePractice(); };
    addEventListener('keydown', onKey);
    teardown = function () { removeEventListener('keydown', onKey); closePractice(); };
    app.appendChild(el('div', { class: 'scroll' }, el('div', { class: 'page' },
      el('div', { class: 'bar' },
        el('a', { class: 'btn quiet', href: '#' + lv }, '← All characters'),
        el('span', { class: 'spacer' }),
        ids.length ? el('button', { class: 'btn primary', type: 'button', onclick: function () { openPractice(ids, lv); } }, 'Practice together') : null,
        clearBtn),
      el('div', { class: 'grid-head' },
        el('p', { class: 'eyebrow', text: L.label }),
        el('h1', { text: 'Our rungs' }),
        el('p', { class: 'desc', text: 'Each of you chooses one rung to carry back to your family. Practice it together so you can teach it.' })),
      list)));
  }
  var practiceNode = null;
  function openPractice(ids, lv) {
    var L = V.levels[lv], i = 0;
    practiceOpen = true;
    practiceNode = el('div', { class: 'practice', role: 'dialog', 'aria-label': 'Practice our rungs' });
    function draw() {
      var c = V.characters[ids[i]], r = c.rung[lv];
      practiceNode.innerHTML = '';
      practiceNode.style.setProperty('--accent', c.color.accent);
      practiceNode.appendChild(el('div', { class: 'ctl' }, el('span', { class: 'muted', text: (i + 1) + ' of ' + ids.length })));
      practiceNode.appendChild(el('div', { class: 'big' },
        el('div', { class: 'nm', text: c.name }), el('div', { class: 'ln', text: r.line }),
        r.he ? el('div', { class: 'he', lang: 'he', dir: 'rtl', text: r.he }) : null,
        r.extra ? el('div', { class: 'ex', text: L.extraLabel + ': ' + r.extra }) : null));
      practiceNode.appendChild(el('div', { class: 'ctl' },
        el('button', { class: 'btn', type: 'button', disabled: i === 0, onclick: function () { i--; draw(); } }, '← Previous'),
        el('button', { class: 'btn primary', type: 'button', onclick: function () { if (i < ids.length - 1) { i++; draw(); } else closePractice(); } }, i < ids.length - 1 ? 'Next rung' : 'Done'),
        el('button', { class: 'btn quiet', type: 'button', onclick: closePractice }, 'Close')));
    }
    draw();
    document.body.appendChild(practiceNode);
  }
  function closePractice() {
    practiceOpen = false;
    if (practiceNode) { practiceNode.remove(); practiceNode = null; }
  }

  /* ---------- Source cards ---------- */
  var sheetNode = null, lastFocus = null;
  function sheetOpen() { return !!sheetNode; }
  function srcLabel(ref) { var s = V.sources[ref]; return (s && s.label) || ref; }
  function srcChip(ref) {
    // A tagged label ("Rashi on Genesis 28:11 · the place") keeps its tag on one line when the chip wraps.
    var label = srcLabel(ref), cut = label.indexOf(' · ');
    var text = cut < 0 ? label : [label.slice(0, cut) + ' ', el('span', { class: 'tag', text: '· ' + label.slice(cut + 3) })];
    return el('button', { class: 'src', type: 'button', onclick: function (e) { e.stopPropagation(); openSheet(ref); } }, icon('book', '0 0 24 24'), el('span', {}, text));
  }
  function openSheet(ref) {
    closeSheet();
    lastFocus = document.activeElement;
    var s = V.sources[ref] || { title: ref, kind: 'Source', missing: true };
    var closer = el('button', { class: 'closer', type: 'button', onclick: closeSheet }, 'Close ✕');
    var body = [];
    if (s.verses) {
      s.verses.forEach(function (v) {
        body.push(el('div', { class: 'verse' }, el('span', { class: 'n', text: v.n }),
          v.he ? el('div', { class: 'he', lang: 'he', dir: 'rtl', text: v.he }) : null,
          v.en ? el('div', { class: 'en', html: v.en }) : null));
      });
    }
    if (s.body) body.push(el('div', { class: 'card-body' }, s.body.map(function (p) { return el('p', {}, p.h ? el('b', { text: p.h }) : null, el('span', { html: p.t })); })));
    if (s.missing) body.push(el('p', { class: 'card-body', text: 'The text for this source is still being added.' }));
    var credit = s.credit && (V.credits[s.credit] || s.credit);
    var sheet = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': s.title },
      closer, el('div', { class: 'kind', text: s.kind || '' }), el('h3', { text: s.title }), body,
      credit ? el('div', { class: 'credit', html: credit }) : null);
    sheetNode = el('div', { class: 'sheet-back', onclick: function (e) { if (e.target === sheetNode) closeSheet(); } }, sheet);
    document.body.appendChild(sheetNode);
    closer.focus();
  }
  function closeSheet() {
    if (!sheetNode) return;
    sheetNode.remove(); sheetNode = null;
    if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) { /* ignore */ }
  }
  addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheetNode) closeSheet(); });

  route();
})();
